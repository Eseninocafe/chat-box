<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Chat Box</title>
	<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
	<!-- The Inter build Figma uses (Google Fonts serves a newer one whose letter widths differ) -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@4.5.15/500.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@4.5.15/600.css">
	<link rel="stylesheet" href="./style.css">
</head>

<body>
	<!-- before first paint, so a saved light theme doesn't flash dark -->
	<script>try { if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode'); } catch (e) {}</script>

	<div class="app">
		<aside class="sidebar">
			<div class="sidebar-header">
				<div class="app-label">
					<h1>Chat Box</h1>
					<button id="themeToggle" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
						<span id="themeIcon" class="icon"></span>
					</button>
				</div>
				<button id="copyBtn" class="btn" type="button"><span id="copyLabel" class="btn-label">Copy Widget URL</span><span class="icon icon-copy"></span></button>
				<div class="load-row">
					<label class="text-field"><input id="loadInput" type="text" placeholder="Paste widget URL" spellcheck="false" autocomplete="off"><span class="bar"></span></label>
					<button id="loadBtn" class="btn" type="button"><span class="btn-label">Load</span><span class="icon icon-enter"></span></button>
				</div>
			</div>
			<div id="settingsList" class="sidebar-list"></div>
		</aside>

		<!-- The chat box itself, with these settings: what Streamer.bot sends, or a demo chat -->
		<main id="previewArea" class="preview-area">
			<iframe id="widget" title="Chat box preview"></iframe>
			<div id="statusPill" class="status-pill">Connected</div>
		</main>
	</div>

	<script src="script.js"></script>
</body>

</html>
